name: CI Pipeline — Arkan Game

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arkan
          POSTGRES_PASSWORD: arkan_test_pass
          POSTGRES_DB: arkan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://arkan:arkan_test_pass@localhost:5432/arkan_test
      JWT_SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      SEED_DEFAULT_DATA: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/ tests/ --select E,F,W --ignore E501

      - name: Unit Tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

      - name: Migration Check
        working-directory: backend
        run: alembic upgrade head

      - name: Docker Build Validation
        run: docker build -t arkangame-backend-test ./backend

  frontend-build:
    name: Frontend — Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
