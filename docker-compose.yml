services:
  postgres:
    image: postgres:16-alpine
    container_name: arkan_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-arkan_db}
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: arkan_redis
    restart: always
    networks:
      - backend_net
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: arkan_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - backend_net
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arkan_game_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-arkan_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arkan_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://mini.arsaku.web.id,http://localhost:3000,http://localhost:8080}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SEED_DEFAULT_DATA=${SEED_DEFAULT_DATA:-false}
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arkan_game_frontend
    restart: always
    networks:
      - frontend_net
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: arkan_caddy
    restart: always
    ports:
      - "8080:80"
    networks:
      - frontend_net
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: arkan_cloudflared
    restart: unless-stopped
    # Mode 1: Menggunakan file config lokal (miniarsaku.yml)
    entrypoint: ["cloudflared", "--config", "/etc/cloudflared/miniarsaku.yml", "tunnel", "run"]
    # Mode 2: Untuk menggunakan TUNNEL_TOKEN dari .env, ganti entrypoint dengan baris di bawah ini:
    # entrypoint: ["cloudflared", "tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}"]
    networks:
      - frontend_net
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
      - ${HOME}/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - caddy
      - frontend
      - backend

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:




